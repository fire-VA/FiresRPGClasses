        targeting: {mode: "Self"}
        cooldown: 120
        duration: 30
        text: "Become the wolf for 30 s: 20% faster, 25% more stamina regeneration, 20% higher jumps, 15% less slash damage taken but 20% more fire damage taken. Your weapons are put away and your bare hands become claws (30 slash + 2 per class level, 30% faster). You can't build, craft or eat new food. Press again to change back."
