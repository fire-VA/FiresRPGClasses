  # Vampire (Fire 10-13; Tools\VAMPIRE_CLASS_DESIGN.md sections 2-5 and 10-12, LOCKED). The class needs the vampire RACE, not a weapon:
  # the player ZDO "rpg_race" = "Vampire" (VCS 0.8.7+), no model fallback; without it the class is greyed out and keeps its points.
  # Bat Form is a Core possession (Druid Wildshape's path) whose time and cooldown grow with the "Bat Form" skill (section 11). The
  # handlers are VampireKit's; numbers the design gives are also server settings in [12 - Vampire]. Sunlight is a race rule (section 5).
  - class: Vampire
    paths:
      - {id: blood, name: "Blood", theme: "Drain, frenzy and the crimson tide"}
      - {id: night, name: "Night", theme: "Wings, shadows and the gaze"}
    nodes:
      - id: vampire_bat_form
        name: "Bat Form"
