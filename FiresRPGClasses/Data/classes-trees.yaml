luck:
  neutral: 50
  formula: {chance: "1 - (1 - p)^(1 + (luck - 50) / 100)", amount: "roll 1 + (luck - 50) / 100 times, keep the best"}
  playerBase: 50
  rollPlayerBase: false          # true: roll like companions (average of three 0-100 rolls)
  companionBase: rolled
  effectiveCap: none            # base stays 0-100; effective luck is uncapped
  companionScalingAbove100: 0.5 # level scaling keeps growing past 100 at half rate
  partyRuleForCreatureDrops: killer   # killer | highestNearby | average
  excluded: [boss trophies, guaranteed drops]
  systems:
    creatureDrops: {enabled: true, maxAttempts: 3, multiplier: 1.0}
    lootTables: {enabled: true, maxAttempts: 3, multiplier: 1.0}
    gathering: {enabled: true, maxAttempts: 3, multiplier: 1.0}
    foraging: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    fishing: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    crafting: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    processing: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    tamingBreeding: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    durability: {enabled: true, maxAttempts: 2, multiplier: 1.0}
    classCrits: {enabled: true, maxAttempts: 2, multiplier: 1.0}
  sources: {consumables: "item data: luck bonus + duration", armor: "item data", weapons: "item data, active bar only", trinkets: "item data", tasks: "achievement and quest rewards, permanent", curses: "negative, from debuffs or events"}
