      tank_adv: tank_thick_hide
      tank_exp: tank_immovable
    hybrids:   # this archetype on the front bar, the key on the back bar
      Paladin: {name: "Crusader", ability: "Divine Bulwark"}
      Berserker: {name: "Juggernaut", ability: "Unstoppable Charge"}
      Rogue: {name: "Shadow Guardian", ability: "Counter Shadow"}
      Ranger: {name: "Warden", ability: "Guardian's Volley"}
      Mage: {name: "Spellbreaker", ability: "Arcane Fortress"}
      Healer: {name: "Bastion", ability: "Protective Aura"}
      Monk: {name: "Iron Monk", ability: "Iron Stance"}
  - class: Paladin
    paths:
