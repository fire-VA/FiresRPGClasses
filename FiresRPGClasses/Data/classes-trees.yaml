# FiresRPGClasses - combat bars, weapons, targeting and skill trees.
# Schema 5: adds the counters section and node rankEffects (doc 21's class-kit gaps). Schema 4 added
# progression and keys; schema 3 added ultimates and luck.
# Existing nodes reference Core ClassAbility ids; their numbers live in Core.
schema: 5
combat:
  bars: {count: 2, slots: 8, weaponSlot: 1, skillSlots: [2, 3, 4, 5, 6, 7], ultimateSlot: 8}
  keys:
    skillsNeedDrawnWeapon: true      # true: 1-8 are skills only while a weapon is drawn
    skillModifier: None              # None | Alt | Ctrl | Shift (Alt recommended; Shift runs and Ctrl crouches in vanilla)
    slots: {1: Alpha1, 2: Alpha2, 3: Alpha3, 4: Alpha4, 5: Alpha5, 6: Alpha6, 7: Alpha7, 8: Alpha8}   # each a Core KeyBinding
    barSwap: Mouse3                  # Unity KeyCode for mouse button 4
    slot1SwapsBars: true
    itemHotbarModifier: Alt          # only when skillsNeedDrawnWeapon is false and skillModifier is None
    suppressVanillaHotbar: "while the skill modifier is held, or while a weapon is drawn in the drawn-weapon scheme; declared to the conflict registry"
  swap: {lockoutSeconds: 0.5, blockedWhileCasting: true, equipsFromInventory: true}
  ultimates: {see: ultimates}
  passives: "passives and automatic abilities are equipped in the passive grid and always on (their own conditions still apply); dodge follows the active bar's archetype; the hybrid works while both bars hold its pair"
  weaponChange: "archetype and skills the new weapon cannot drive are greyed out until the player picks an allowed archetype"
  restoreLastBarPerWeapon: false   # setting; off matches the design, on re-slots the last bar used with that weapon
targeting:
  castStyle: {default: quickWithIndicator, options: [normal, quick, quickWithIndicator]}
  smartHeal: true
  modes:
    - {mode: "Placed", means: "Hold the key: a reticle appears where you aim; release (or click) to place it. Right-click cancels."}
    - {mode: "Ally", means: "Heals or buffs the ally under your crosshair; with nobody targeted, the most injured ally in range, else you."}
    - {mode: "Aimed", means: "Fires along your crosshair: a projectile, beam or mark."}
    - {mode: "Melee", means: "Uses your weapon swing, in the direction you face."}
    - {mode: "Around you", means: "Instant, centred on you."}
    - {mode: "Self", means: "Instant buff or stance on you."}
    - {mode: "Next attack", means: "Empowers your next weapon attack."}
    - {mode: "Dash", means: "Moves you along your crosshair."}
    - {mode: "Dodge", means: "Not slotted: replaces your dodge roll while that archetype is on the active bar."}
    - {mode: "Automatic", means: "Not slotted: always on while the archetype is on the active bar."}
weapons:
  - {weapon: "Sword, with shield", archetypes: ["Paladin", "Tank"]}   # first = default
  - {weapon: "Axe, with shield", archetypes: ["Tank", "Paladin", "Berserker"]}   # first = default
  - {weapon: "Club or mace, with shield", archetypes: ["Paladin", "Tank", "Healer"]}   # first = default
  - {weapon: "Spear, with shield", archetypes: ["Tank", "Ranger"]}   # first = default
  - {weapon: "Sword, no shield", archetypes: ["Rogue", "Berserker"]}   # first = default
  - {weapon: "Axe, no shield (incl. dual axes)", archetypes: ["Berserker", "Rogue"]}   # first = default
  - {weapon: "Club or mace, no shield", archetypes: ["Monk", "Berserker"]}   # first = default
  - {weapon: "Knives (incl. dual knives)", archetypes: ["Rogue", "Monk"]}   # first = default
  - {weapon: "Two-handed sword", archetypes: ["Berserker", "Paladin"]}   # first = default
  - {weapon: "Battleaxe", archetypes: ["Berserker", "Tank"]}   # first = default
  - {weapon: "Sledge", archetypes: ["Berserker", "Monk"]}   # first = default
  - {weapon: "Atgeir", archetypes: ["Tank", "Berserker", "Monk"]}   # first = default
  - {weapon: "Unarmed or fist weapons", archetypes: ["Monk", "Berserker"]}   # first = default
  - {weapon: "Spear, no shield", archetypes: ["Ranger", "Rogue"]}   # first = default
  - {weapon: "Bow", archetypes: ["Ranger", "Rogue"]}   # first = default
  - {weapon: "Crossbow", archetypes: ["Ranger", "Rogue"]}   # first = default
  - {weapon: "Elemental staff", archetypes: ["Mage", "Healer"]}   # first = default
  - {weapon: "Blood-magic staff", archetypes: ["Healer", "Mage"]}   # first = default
progression:
  characterLevels: 100
  hoursToLevel100: 120
  hoursPerLevel: "0.15 + 0.00260 * level^1.5"   # re-fit the XP table to measured XP per hour
  talentPoints: {perLevel: 3, bonusEveryTenthLevel: 1, atLevel100: 307, allTrees: 612}
  valor: {startsAfterLevel: 100, hoursPerLevel: 5, xpVsLevel100: 1.8, pointsPerLevel: 4, treesFullAt: 77, keepsCounting: true}
  rankCost: [1, 2, 3]
  levelGates: "node levels are character levels"
  masterNeedsPointsInPath: 10
  ultimates: {slot8AtLevel: 10, ultimateINeedsPointsInTree: 10, ultimateIINeedsPointsInOnePath: 20, hybridNeedsLevel: 25, hybridNeedsPointsInEachArchetype: 10}
  passiveSlots:
    pool: "40 tree passives + 10 automatic abilities"
    unlocks: {level5: 2, level15: 3, level30: 4, level45: 5, level60: 6, level80: 7, level100: 8, valor15: 9, valor35: 10, valor55: 11, valor75: 12}
  attributes: {pointEveryLevels: 2, thenPointEveryValorLevels: 2, max: 80}
  respec: "refunds every point in one archetype's tree"
  serverSettings:                # FiresRPGClasses.Progression; synced, admin-only
    xpMultiplier: 1.0
    killXpMultiplier: 1.0
    nonCombatXpMultiplier: 1.0
    questXpMultiplier: 1.0         # includes EpicMMO_Exp
    skillPointsPerLevel: 3
    extraSkillPointsEveryTenthLevel: 1
    skillPointsPerValorLevel: 4
    valorLevelXp: 1.8              # x the XP of level 100
    attributePointsPerLevel: 0.5   # fractions accumulate
    attributePointsPerValorLevel: 0.5
    attributePointsMax: 80
    whenPointsDrop: Keep           # Keep | Refund
  earnedPoints: "computed from level, Valor and the current settings; only spending is stored"
  xp:                            # doc 20
    kills: {perHealth: 0.1, minHealth: 10, stars: "x star level", bossMultiplier: 5, rangeMeters: 50, activeInFightSeconds: 30, companionDamageCountsForOwner: true, groupShare: 1.0, pvp: false, overrides: "synced table: prefab -> XP, 0 = none"}
    discoveryPercentOfLevel: {newBiome: 25, bossFirstKill: 50, newLocationType: 10, newCreatureKilled: 3, newItem: 1, newRecipeOrPiece: 1}
    repeatable:
      hourlyCapPercentOfLevel: 20
      tree: "2 x (1 + tool tier)"
      rockOrOre: "1 x (1 + tool tier) per piece broken off"
      destructible: "1 x (1 + tool tier)"
      pick: 1
      fish: "5 x fish quality"
      tame: "3 x the creature's kill XP"
      craft: "2 x (1 + station level)"
      collectFromStation: 1
    building: "new piece types only, as a discovery"
    skillLevelUpPercentOfLevel: 2
    quests: "as authored; quest multiplier applies"
    restedBonus: 0.10
    deathLossOfLevelProgress: 0.0  # never removes a level
    consumables:
      xpStones: {tiers: [Meadows, BlackForest, Swamp, Mountains, Plains, Mistlands, Ashlands], needsLevel: [1, 10, 25, 40, 55, 70, 85], worth: "1/3 of a level at the middle of its biome band", afterLevel100: "adds Valor XP", dropChance: {normal: 0.01, elite: 0.05, champion: 0.15}, bossDrops: 3, boostsApply: false}
      meadsOfInsight: {minor: 0.25, medium: 0.50, greater: 1.00, minutes: 30, stacking: "one at a time; stronger replaces weaker; same refreshes", addsWithRested: true, boosts: [kills, repeatable work and its cap, skill level-ups]}
    biomeBands: {Meadows: [1, 10], BlackForest: [10, 25], Swamp: [25, 40], Mountains: [40, 55], Plains: [55, 70], Mistlands: [70, 85], Ashlands: [85, 100]}
    never: [tamed or player-owned creatures, summons, training dummies, other players unless pvp, kills with no active player in range, creatures under 10 health, repeat building, item pickups, repeatable work beyond the hourly cap]
rules:
  prerequisite: "one learned node in the previous tier of the same path (the starter counts for every path)"
  variant: "nodes sharing a variant id can both be learned; a bar slots only one of them"
  after: "a node with after: X requires X"
  rankEffects: "riders a node gains at a given rank and keeps above it; they never change a node's rank count or point cost"
counters:
  purpose: "doc 21's monster affixes each need an answer in the class kits; every counter below lives in at least two archetypes"
  keywords:
    - id: Wounded
      applies: enemy
      effect: "Receives 50% less healing from every source, its own Mending Aura and Vampiric affixes included."
      core: "WoundedEffect (new): a healing-received multiplier every heal path reads"
    - id: Sundered
      applies: enemy
      effect: "25% less armor for 8 s."
      core: "SunderedEffect (new): an armor multiplier in the damage calculation"
    - id: Breach
      applies: hit
      effect: "Damage this hit deals to an absorb shield counts three times, and a shield left under 10% of its capacity breaks outright."
      core: "HitData breach flag (new), read by ArcaneShieldEffect and by the Shielded affix and ward totems in FiresMonsters"
    - id: Silenced
      applies: enemy
      effect: "Cannot begin a cast for its duration, and a cast already running is cancelled unless it is uninterruptible (a grey cast bar)."
      core: "SilencedEffect (new), over the cast state FiresMonsters publishes on the creature's ZDO"
    - id: Cleanse
      applies: ally
      effect: "Removes debuffs, strongest first."
      core: "PurifyEffect's debuff classifier, lifted into one shared cleanse helper"
  matrix:
    - counter: interrupt
      affixes: ["Mending Aura", "Summoner", "Shaman and Caster roles"]
      everyPlayer: "a parry staggers, and a stagger interrupts"
      archetypes:
        - {archetype: Tank, via: "tank_shield_bash (full stagger damage), tank_earthshaker (staggers every target)"}
        - {archetype: Paladin, via: "paladin_hammer_of_justice (2 s stun)"}
        - {archetype: Rogue, via: "rogue_feint (ignores block and staggers)"}
        - {archetype: Monk, via: "monk_pressure_points (staggers on the combo hit), monk_palm_of_the_storm (stuns)"}
        - {archetype: Mage, via: "mage_ice_lance rank 3 (Silenced, 40 m), mage_arcane_torrent (Silenced on the first tick)"}
        - {archetype: Ranger, via: "ranger_piercing_shot rank 3 (Concussive stagger)"}
    - counter: antiHeal
      affixes: ["Mending Aura", "Vampiric"]
      archetypes:
        - {archetype: Rogue, via: "rogue_virulence rank 3 (Wounded while poisoned)"}
        - {archetype: Berserker, via: "berserker_cleave rank 3 (Wounded for 6 s)"}
    - counter: shieldBreak
      affixes: ["Shielded", "Warded"]
      archetypes:
        - {archetype: Tank, via: "tank_shield_bash rank 3 (Breach)"}
        - {archetype: Ranger, via: "ranger_piercing_shot rank 2 (Breach)"}
    - counter: cleanse
      affixes: ["Hexer", "Molten", "Frostbound", "Plagued"]
      archetypes:
        - {archetype: Healer, via: "healer_purify, healer_purify_circle, Avatar of Life's Mending attunement"}
        - {archetype: Paladin, via: "paladin_mending_light rank 3, Avatar of Light's Sunrise capstone"}
        - {archetype: Monk, via: "monk_inner_peace - promised by its Core description but not implemented; pending the Core fix"}
    - counter: taunt
      affixes: ["Blink", "Pack Leader", "Mending Aura", "Brute role"]
      archetypes:
        - {archetype: Tank, via: "tank_taunt, tank_immortal_stance, Hold the Line's Advancing Line morph"}
        - {archetype: Paladin, via: "paladin_shield_wall rank 3 (8 m frontal taunt)"}
      companions: "a tank companion holds a pack for a solo player; companions build threat like players"
    - counter: sunder
      affixes: ["not an affix counter; doc 21's gaps table asks for armor breaking alongside shield breaking"]
      archetypes:
        - {archetype: Tank, via: "tank_breakwall (everything it knocks down)"}
        - {archetype: Berserker, via: "berserker_cleave rank 2"}
    - counter: crowdControl
      affixes: ["Blink", "Frenzied", "Skirmisher role"]
      archetypes:
        - {archetype: Mage, via: "mage_absolute_zero, mage_blizzard, mage_ice_lance, mage_glacial_ward"}
        - {archetype: Ranger, via: "ranger_trapper (root), Volley's Pinning Volley morph"}
        - {archetype: Tank, via: "tank_earthshaker (slow)"}
        - {archetype: Rogue, via: "rogue_toxic_cloud, rogue_caltrops"}
        - {archetype: Berserker, via: "berserker_horn_of_valhalla (flee)"}
        - {archetype: Paladin, via: "paladin_hammer_of_justice (stun)"}
    - counter: stagger
      affixes: ["Stoneskin"]
      everyPlayer: "a parry staggers"
      archetypes:
        - {archetype: Tank, via: "tank_shield_bash, tank_earthshaker, tank_parry_restore"}
        - {archetype: Monk, via: "monk_pressure_points, monk_palm_of_the_storm"}
        - {archetype: Rogue, via: "rogue_feint"}
        - {archetype: Paladin, via: "paladin_hammer_of_justice, Avatar of Judgement (staggers undead)"}
    - counter: burst
      affixes: ["Shielded", "Spirit-linked", "Enrage"]
      archetypes:
        - {archetype: Berserker, via: "berserker_execute, berserker_bloodbath, berserker_headtaker"}
        - {archetype: Rogue, via: "rogue_assassinate, rogue_death_mark"}
        - {archetype: Ranger, via: "ranger_killshot, ranger_perfect_shot"}
        - {archetype: Mage, via: "mage_meteor, mage_overcharge"}
        - {archetype: Monk, via: "monk_chi_explosion, monk_thousand_steps"}
        - {archetype: Paladin, via: "paladin_wrath_of_the_aesir, paladin_hammer_of_justice"}
    - counter: aoe
      affixes: ["Warded (the totem)", "Splitting", "Summoner (the adds)"]
      archetypes:
        - {archetype: Tank, via: "tank_earthshaker, tank_breakwall"}
        - {archetype: Paladin, via: "paladin_consecration, paladin_wrath_of_the_aesir"}
        - {archetype: Berserker, via: "berserker_cleave, berserker_leap"}
        - {archetype: Rogue, via: "rogue_toxic_cloud, rogue_plague_burst"}
        - {archetype: Monk, via: "monk_chi_explosion, monk_mountain_s_patience"}
        - {archetype: Ranger, via: "ranger_multishot, ranger_rain_arrows, ranger_volley"}
        - {archetype: Mage, via: "mage_blizzard, mage_meteor, mage_firestorm"}
    - counter: kiting
      affixes: ["Vampiric", "Frenzied", "Brute role"]
      archetypes:
        - {archetype: Ranger, via: "ranger_kiting, ranger_disengage"}
        - {archetype: Monk, via: "monk_swift_feet, monk_tailwind, monk_wind_step"}
        - {archetype: Mage, via: "mage_blink, mage_ice_lance (slow)"}
        - {archetype: Rogue, via: "rogue_shadow_escape, rogue_quickstep"}
    - counter: mobility
      affixes: ["Molten", "Frostbound", "Plagued", "Death Burst", "Reflective", "every telegraphed ring"]
      everyPlayer: "the vanilla dodge, and each archetype's emergency evasion, which is never slotted"
      archetypes:
        - {archetype: Tank, via: "tank_shield_charge"}
        - {archetype: Paladin, via: "paladin_divine_retreat"}
        - {archetype: Berserker, via: "berserker_leap"}
        - {archetype: Rogue, via: "rogue_shadow_escape"}
        - {archetype: Monk, via: "monk_wind_step, monk_swift_feet, monk_leaf_on_the_wind"}
        - {archetype: Ranger, via: "ranger_disengage"}
        - {archetype: Mage, via: "mage_blink"}
        - {archetype: Healer, via: "healer_fade"}
  companionAi: "companions cannot yet pick these riders on purpose: SkillDecisionSystem.SkillTrigger has no EnemyCasting, EnemyHealing or EnemyShielded, so a rider fires only when its base skill does"
  coreGaps:                      # effects Core promises in text but does not implement; the keywords above should be their one implementation
    - "monk_inner_peace: ClassAbilityRegistry says it cleanses debuffs; InnerPeaceEffect only heals and buffs. Implementing Cleanse there is doc 21's Monk self-cleanse."
    - "Spellthief (Rogue + Mage) Mana Drain: ManaDrainEffect carries SilenceDuration = 3 s and a description promising a silence, but applies none. It should use SilencedEffect."
